<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">netbox-facilitymap</title>
  <desc id="desc">A floor plan of rooms with a location pin, marking a room linked to a NetBox Location.</desc>
  <metadata>
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:title>netbox-facilitymap icon</dc:title>
        <dc:creator><cc:Agent><dc:title>Liam Sbarro</dc:title></cc:Agent></dc:creator>
        <dc:rights><cc:Agent><dc:title>Liam Sbarro</dc:title></cc:Agent></dc:rights>
        <cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3f66"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#ff5c6e"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#badge)"/>

  <!-- Floor plan: an outer suite split into rooms by interior walls -->
  <g fill="none" stroke="#e6eefb" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <rect x="96" y="208" width="320" height="192" rx="10"/>
    <path d="M288 208 V336"/>
    <path d="M96 320 H288"/>
  </g>

  <!-- Location pin marking a room -->
  <g>
    <path d="M283 220 L373 220 L328 318 Z" fill="url(#pin)"/>
    <circle cx="328" cy="176" r="62" fill="url(#pin)"/>
    <circle cx="328" cy="168" r="24" fill="#ffffff"/>
  </g>
</svg>
